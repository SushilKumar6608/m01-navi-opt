name: m01-navi-opt

x-airflow-common: &airflow-common
  # `image:` alongside `build:` so all three services sharing this anchor
  # (airflow-init, airflow-webserver, airflow-scheduler) resolve to the
  # SAME built image and tag rather than each triggering its own build —
  # compose builds once for the first service that needs it and reuses
  # the tag for the rest.
  image: m01-navi-opt-airflow:latest
  build:
    context: ./airflow
    dockerfile: Dockerfile
  # Phase 5: env_file (not just `environment:`) so the SAME .env the
  # standalone scripts already use for COPERNICUSMARINE_SERVICE_USERNAME/
  # _PASSWORD also reaches the Airflow containers, without duplicating
  # those values into this compose file. Path is relative to this file
  # (infra/docker-compose.yml), i.e. the project root's .env — copy
  # .env.example to .env there first if you haven't (see README).
  env_file:
    - ../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Lets `infra/airflow/dags/*.py` do `from navi_opt.orchestration...`
    # against the bind-mounted ../src below without installing the
    # navi_opt package into the image — the same "point PYTHONPATH at
    # src/ instead of pip-installing" convention pyproject.toml's
    # `pythonpath = ["src"]` already uses for pytest.
    PYTHONPATH: /opt/airflow/src
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ../src:/opt/airflow/src
    # config/ and data/ are mounted as siblings of src/ inside the
    # container (i.e. at /opt/airflow/config, /opt/airflow/data) because
    # vessel_profiles.py, port_anchors.py, and graph_builder.py all
    # resolve their cache/config paths as `Path(__file__).resolve()
    # .parents[N] / "config"|"data"` relative to their own location under
    # src/ — the same repo-root-relative convention already used when
    # these modules run locally, unchanged here, not a container-specific
    # special case.
    - ../config:/opt/airflow/config
    - ../data:/opt/airflow/data
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---- Postgres: metadata DB for Airflow ----
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # ---- Airflow: one-time DB init + admin user creation ----
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - "airflow db migrate && airflow users create --username admin --password admin --firstname Sushil --lastname Kumar --role Admin --email admin@example.com || true"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---- Kafka: single-node, KRaft mode (no Zookeeper needed) ----
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # ---- Kafka UI: browse topics/messages in a browser (optional but handy) ----
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: navi-opt
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    restart: unless-stopped

volumes:
  postgres-db-volume:
  kafka-data:
